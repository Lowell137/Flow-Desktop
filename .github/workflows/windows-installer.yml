name: Windows installer (Inno Setup)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0-beta3-win)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Build Inno Setup installer
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build release executable
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.local.conf.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" packaging\windows\flow.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist-installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: flow-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $file = (Get-ChildItem dist-installer\*.exe | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --title "Flow ${{ steps.version.outputs.value }} (Windows)" --notes "Windows x64 installer built with Inno Setup from commit ${{ github.sha }}. Requires Node.js 22+ on PATH for playback token minting." --prerelease --target ${{ github.sha }}
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
